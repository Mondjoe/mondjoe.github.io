<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Charm Capsule — Sovereign Dashboard</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b0c10" />

  <!-- Styles -->
  <link rel="stylesheet" href="/dashboard.css" />
  <link rel="stylesheet" href="/snapshot.css" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" />
</head>

<body>

  <!-- Theme Toggle -->
  <div class="theme-toggle" onclick="toggleTheme()">Toggle Theme</div>

  <!-- Root App Container -->
  <div id="app">
    <!-- Router will inject content here -->
  </div>

  <!-- Scripts -->
  <script src="/router.js"></script>
  <script src="/snapshot-viewer.js"></script>
  <script src="/snapshot-list.js"></script>
  <script src="/governance.js"></script>
  <script src="/capsule-info.js"></script>

  <script>
    // Theme toggle logic
    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("charm-theme", next);
    }

    // Load saved theme
    (function () {
      const saved = localStorage.getItem("charm-theme");
      if (saved) document.documentElement.setAttribute("data-theme", saved);
    })();

    // Register service worker
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>

</body>
</html>
