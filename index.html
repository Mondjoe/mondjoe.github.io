<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Charm Capsule</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Theme Colors -->
  <meta name="theme-color" content="#0b0c10" />
  <meta name="background-color" content="#000000" />

  <!-- Open Graph -->
  <meta property="og:title" content="Charm Capsule" />
  <meta property="og:description" content="Proof‑Driven Governance • Multi‑Chain Capsule" />
  <meta property="og:image" content="/Assets/og-image.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mondjoe.github.io" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Charm Capsule" />
  <meta name="twitter:description" content="Proof‑Driven Governance • Multi‑Chain Capsule" />
  <meta name="twitter:image" content="/Assets/og-image.png" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: "Inter", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
   <script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");

    navigator.serviceWorker.addEventListener("message", (event) => {
      if (event.data && event.data.type === "NEW_VERSION") {
        showUpdatePopup();
      }
    });
  }

  function showUpdatePopup() {
    const box = document.createElement("div");
    box.style.position = "fixed";
    box.style.bottom = "20px";
    box.style.left = "50%";
    box.style.transform = "translateX(-50%)";
    box.style.background = "#111";
    box.style.color = "#fff";
    box.style.padding = "14px 20px";
    box.style.borderRadius = "8px";
    box.style.fontFamily = "Inter, sans-serif";
    box.style.boxShadow = "0 0 12px rgba(255,255,255,0.15)";
    box.style.zIndex = "9999";
    box.style.textAlign = "center";
    box.style.fontSize = "15px";
    box.style.opacity = "0.95";

    box.innerHTML = `
      New version available — <strong>Refresh?</strong>
      <button id="refreshBtn" style="
        margin-left: 10px;
        padding: 6px 12px;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      ">Refresh</button>
    `;

    document.body.appendChild(box);

    document.getElementById("refreshBtn").onclick = () => {
      location.reload(true);
    };
  }
</script>

    .container {
      max-width: 600px;
      padding: 20px;
    }

    h1 {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      opacity: 0.8;
      line-height: 1.6;
    }

    .moon {
      width: 160px;
      height: auto;
      margin-bottom: 25px;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="/Assets/og-image.png" alt="Charm Capsule Moon Symbol" class="moon" />
    <h1>Charm Capsule</h1>
    <p>Proof‑Driven Governance • Multi‑Chain Capsule</p>
  </div>

  <!-- PWA Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
