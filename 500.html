<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Internal Error — Charm Capsule</title>

  <link rel="stylesheet" href="/dashboard.css" />
  <link rel="stylesheet" href="/snapshot.css" />
  <link rel="icon" href="/favicon.ico" />
</head>

<body>

  <div class="snapshot-list">
    <div class="snapshot-card">
      <h1>500 — Internal Error</h1>
      <p>Something went wrong inside the capsule.</p>
      <p>This is usually temporary. You can try again or return to the dashboard.</p>

      <div class="snapshot-actions" style="margin-top:1rem;">
        <button class="snapshot-btn" onclick="window.location.reload()">
          Retry
        </button>

        <button class="snapshot-btn" onclick="window.location.href='/index.html'">
          Go to Dashboard
        </button>
      </div>
    </div>
  </div>

</body>
</html>
