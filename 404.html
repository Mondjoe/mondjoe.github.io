<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=/index.html" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Redirecting…</title>

  <link rel="stylesheet" href="/dashboard.css" />
  <link rel="stylesheet" href="/snapshot.css" />
</head>

<body>

  <div class="snapshot-list">
    <div class="snapshot-card">
      <h1>404 — Redirecting</h1>
      <p>This page does not exist. Returning to the dashboard…</p>

      <button class="snapshot-btn" onclick="window.location.href='/index.html'">
        Go to Dashboard
      </button>
    </div>
  </div>

  <script>
    // Hard redirect fallback (for browsers that ignore meta refresh)
    setTimeout(() => {
      window.location.href = "/index.html";
    }, 150);
  </script>

</body>
</html>
