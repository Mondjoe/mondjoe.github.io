<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Offline — Charm Capsule</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- Theme Colors -->
  <meta name="theme-color" content="#0b0c10" />
  <meta name="background-color" content="#000000" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: "Inter", sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
    }

    img {
      width: 140px;
      opacity: 0.9;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      opacity: 0.8;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    button {
      padding: 10px 18px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="/Assets/og-image.png" alt="Charm Capsule Moon Symbol" />

    <h1>You’re Offline</h1>
    <p>
      Charm Capsule can’t connect right now.<br />
      Check your connection and try again.
    </p>

    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
