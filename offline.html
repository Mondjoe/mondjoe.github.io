<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Offline — Charm Capsule</title>

  <link rel="stylesheet" href="/dashboard.css" />
  <link rel="stylesheet" href="/snapshot.css" />

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 1.5rem;
    }
    .offline-box {
      max-width: 420px;
    }
    h1 {
      margin-bottom: 0.5rem;
    }
    p {
      opacity: 0.85;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="offline-box snapshot-card">
    <h1>You’re Offline</h1>
    <p>The moon still shines, but the network doesn’t.</p>
    <p>Reconnect to continue exploring your capsule.</p>

    <div class="snapshot-actions" style="margin-top:1rem;">
      <button class="snapshot-btn" onclick="window.location.reload()">
        Retry
      </button>
    </div>
  </div>

</body>
</html>
