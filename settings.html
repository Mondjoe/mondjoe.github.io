<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Settings — Charm Capsule</title>

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Styles -->
  <link rel="stylesheet" href="/dashboard.css" />
  <link rel="stylesheet" href="/snapshot.css" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" />
</head>

<body>

  <div class="snapshot-list">
    <h1>Settings</h1>
    <p>Configure your Charm Capsule experience.</p>

    <!-- Theme Card -->
    <div class="snapshot-card">
      <h2>Theme</h2>
      <p>Switch between Dark and Light mode.</p>

      <button class="snapshot-btn" onclick="toggleTheme()">
        Toggle Theme
      </button>
    </div>

    <!-- Cache Card -->
    <div class="snapshot-card">
      <h2>Cache</h2>
      <p>Clear offline cache and refresh the PWA.</p>

      <button class="snapshot-btn" onclick="clearCache()">
        Clear Cache
      </button>
    </div>

    <!-- Navigation -->
    <div class="snapshot-card">
      <h2>Navigation</h2>
      <button class="snapshot-btn" onclick="router.navigate('#/')">Home</button>
      <button class="snapshot-btn" onclick="router.navigate('#/snapshots')">Snapshots</button>
      <button class="snapshot-btn" onclick="router.navigate('#/governance')">Governance</button>
      <button class="snapshot-btn" onclick="router.navigate('#/capsule')">Capsule Identity</button>
    </div>
  </div>

  <script>
    // Theme toggle
    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("charm-theme", next);
    }

    // Load saved theme
    (function () {
      const saved = localStorage.getItem("charm-theme");
      if (saved) document.documentElement.setAttribute("data-theme", saved);
    })();

    // Cache clearing
    async function clearCache() {
      // Clear browser caches
      const keys = await caches.keys();
      for (const key of keys) {
        await caches.delete(key);
      }

      // Clear service worker cache
      if ("serviceWorker" in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const reg of regs) {
          await reg.unregister();
        }
      }

      alert("Cache cleared. The app will refresh.");
      location.reload(true);
    }
  </script>

  <!-- Router -->
  <script src="/router.js"></script>

</body>
</html>
