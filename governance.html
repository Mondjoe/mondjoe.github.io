<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Governance — Charm Capsule</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Theme Colors -->
  <meta name="theme-color" content="#0b0c10" />
  <meta name="background-color" content="#000000" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 10px;
      text-align: center;
    }

    p {
      font-size: 16px;
      opacity: 0.8;
      text-align: center;
      margin-bottom: 30px;
    }

    .card {
      width: 100%;
      max-width: 700px;
      background: #111;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(255,255,255,0.08);
      margin-bottom: 20px;
    }

    .card h2 {
      margin: 0 0 10px 0;
      font-size: 22px;
      font-weight: 600;
    }

    .gov-proposal {
      background: #151515;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: none;
      background: #222;
      color: #fff;
      font-size: 15px;
    }

    button {
      padding: 10px 18px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.9;
    }

    nav {
      margin-top: 30px;
      text-align: center;
    }

    nav a {
      color: #fff;
      margin: 0 10px;
      font-size: 16px;
      text-decoration: none;
      opacity: 0.85;
    }

    nav a:hover {
      opacity: 1;
    }
  </style>
</head>

<body>

  <h1>Governance</h1>
  <p>Proposal engine • Snapshot‑anchored decisions • Sovereign governance capsule</p>

  <!-- Create Proposal -->
  <div class="card">
    <h2>Create Proposal</h2>

    <input id="p-title" placeholder="Proposal title" />
    <textarea id="p-desc" placeholder="Description"></textarea>

    <button onclick="createNewProposal()">Submit Proposal</button>
  </div>

  <!-- Proposal List -->
  <div class="card">
    <h2>Proposals</h2>
    <div id="gov-list">Loading proposals…</div>
  </div>

  <nav>
    <a href="/index.html">Home</a>
    <a href="/dashboard.html">Dashboard</a>
    <a href="/about.html">About</a>
    <a href="/settings.html">Settings</a>
  </nav>

  <script src="/governance.js"></script>
  <script src="/router.js"></script>

  <script>
    function createNewProposal() {
      const title = document.getElementById("p-title").value.trim();
      const description = document.getElementById("p-desc").value.trim();

      if (!title) {
        alert("Proposal title is required.");
        return;
      }

      CharmGovernance.createProposal({
        title,
        description,
        chain: "multi-chain",
        tags: []
      });

      CharmGovernance.renderProposals("#gov-list");

      document.getElementById("p-title").value = "";
      document.getElementById("p-desc").value = "";
    }

    document.addEventListener("DOMContentLoaded", () => {
      CharmGovernance.renderProposals("#gov-list");
    });
  </script>

</body>
</html>
